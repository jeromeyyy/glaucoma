services:
  - type: web
    name: glucom-xai
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NO_ALBUMENTATIONS_UPDATE
        value: "1"
      - key: MPLCONFIGDIR
        value: /app/.matplotlib_cache
      - key: LOW_MEMORY_MODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false


